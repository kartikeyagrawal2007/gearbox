# Copy to gearbox.yaml (or point $GEARBOX_CONFIG at it) and edit.
#
# Tiers are ordered cheapest -> strongest. `model` is any LiteLLM model string:
#   ollama_chat/<tag>          local Ollama
#   hosted_vllm/<name>         a vLLM OpenAI-compatible server (set api_base)
#   anthropic/..., openai/..., gemini/..., openrouter/...   hosted APIs (keys via env vars)
#
# Prices are USD per million tokens. The numbers below are ILLUSTRATIVE PLACEHOLDERS:
# replace them with current published prices. For local models, use what a hosted
# provider charges for the same open model ("API-equivalent"), or 0.

tiers:
  - name: nano
    model: ollama_chat/qwen3:1.7b
    input_price: 0.02
    output_price: 0.08
  - name: small
    model: ollama_chat/qwen3:4b
    input_price: 0.05
    output_price: 0.2
  - name: medium
    model: ollama_chat/qwen3:14b
    input_price: 0.1
    output_price: 0.4
  - name: large
    model: ollama_chat/qwen3:32b
    input_price: 0.2
    output_price: 0.8

# The agent that calls Gearbox (Claude, Gemini, GPT inside your IDE). Only used to
# estimate savings. Placeholder prices: set them to your host model's real ones.
host:
  input_price: 3.0
  output_price: 15.0
  cache_read_price: 0.3

leverage: 1                 # constant safety margin in tiers (used when no risk is given)
risk_scaled_leverage: true  # low/medium/high risk -> +0/+1/+2, plus 1 more when the estimator is unsure
difficulty: heuristic       # heuristic (free) | judge (a cheap tier rates difficulty)
judge_tier: 0
max_concurrent: 4           # delegated subtasks running at once
task_timeout_s: 600         # per attempt
max_escalations: 1          # move up a tier on UNSURE / error / timeout / failed check.
                            # With checks, use (number of tiers - 1) so a failure can climb the whole ladder.
# Leverage for subtasks that come with a check, by how many cases the check tests (weak: 1-3,
# medium: 4-9, strong: 10+ or a loop over data). Failed checks escalate, so leverage only has
# to cover what the check misses. Measured on a 5-tier ladder (bench/weak_checks.py); {} = off.
check_leverage: {weak: 2, medium: 1, strong: 0}

# Executable acceptance checks: delegate(..., check="assert f(2) == 4") runs the host's test code
# against the worker's answer. This EXECUTES MODEL-WRITTEN CODE. Isolation is best effort (temp dir,
# empty env, timeouts, CPU/file limits, no network via sandbox-exec or unshare), not a security
# boundary. Leave it off unless you are fine running that code here, or run Gearbox in a VM.
code_checks: false
check_timeout_s: 20
