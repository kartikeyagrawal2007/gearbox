# Routing ladder for the A5000 VM: one current family (Qwen3.5) at five sizes, cheapest first.
# Thinking is switched off (reasoning_effort: none -> Ollama think: false) so tiers differ by
# size, not by whether they reason. Prices are 0 on purpose: on this machine cost is measured
# as GPU time and energy, not API spend.
tiers:
  - {name: q0.8b, model: ollama_chat/qwen3.5:0.8b, params: {reasoning_effort: none}}
  - {name: q2b,   model: ollama_chat/qwen3.5:2b,   params: {reasoning_effort: none}}
  - {name: q4b,   model: ollama_chat/qwen3.5:4b,   params: {reasoning_effort: none}}
  - {name: q9b,   model: ollama_chat/qwen3.5:9b,   params: {reasoning_effort: none}}
  - {name: q27b,  model: ollama_chat/qwen3.5:27b,  params: {reasoning_effort: none}, context_window: 8192}

leverage: 1
risk_scaled_leverage: true
start_floor: q4b      # never start on the 0.8B/2B: same accuracy, 2.8x faster on HumanEval+
difficulty: heuristic
# The learned router (bench/router_train.py): the 4B judge rates each task, and the cheapest
# tier likely enough to pass is chosen. To use it, replace `difficulty: heuristic` with:
#   difficulty: learned
#   router_model: ../routers/judge-qwen3.5-4b.json
max_concurrent: 4
task_timeout_s: 600
max_escalations: 4   # a failed check can climb the whole ladder (start cheap, escalate)

# Checks run model-written code. On this VM they run inside WSL with no network
# (unshare -rn) when the kernel allows it; vm/setup_wsl.sh reports which isolation you got.
code_checks: true
check_timeout_s: 20
