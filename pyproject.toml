[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gearbox-llm"
version = "0.1.0"
description = "Automatic transmission for LLM agents: difficulty-based model selection with leverage, and asynchronous delegation of subtasks to cheaper models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "litellm>=1.50",
  "mcp>=2.0",
  "pyyaml>=6.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
gearbox = "gearbox.cli:main"
gearbox-mcp = "gearbox.integrations.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["gearbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
